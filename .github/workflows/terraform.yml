name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Required for OIDC. Without id-token: write there is no token to exchange,
# and the Azure login step fails with a fairly unhelpful message.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:        true

jobs:
  # -------------------------------------------------------------------------
  # PLAN — runs on every pull request. Never changes anything.
  # -------------------------------------------------------------------------
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Format check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.event.repository.name }}.tfstate"

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Comment plan on pull request
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = (process.env.PLAN || '').substring(0, 60000);
            const body = `#### Terraform Format \`${{ steps.fmt.outcome }}\`
            #### Terraform Plan \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }}, commit \`${{ github.sha }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

      # Fail the check after commenting, so the reviewer sees why.
      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Fail on format error
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::error::terraform fmt found unformatted files. Run 'terraform fmt -recursive' locally."
          exit 1

  # -------------------------------------------------------------------------
  # SECURITY SCAN — runs on every pull request, alongside Plan.
  # Gitleaks looks for committed secrets; Checkov looks for Terraform
  # misconfigurations. Results land in the repo's Security tab.
  # -------------------------------------------------------------------------
  security-scan:
    name: Security scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so Gitleaks can scan every commit

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov (IaC misconfiguration scan)
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov

  # -------------------------------------------------------------------------
  # APPLY — runs on merge to main, and only after a human approves.
  # The gate is the GitHub Environment, not anything in this file.
  # -------------------------------------------------------------------------
  apply:
    name: Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.event.repository.name }}.tfstate"

      - name: Apply
        run: terraform apply -auto-approve -input=false
